Políticas de Privacidade, Reembolso e Termos de Uso
Diretrizes transparentes de atendimento, proteção de dados pessoais e direitos garantidos ao consumidor.
1. Política de Reembolso e Cancelamento
Em total conformidade com o Artigo 49 do Código de Defesa do Consumidor (Lei nº 8.078/1990), o cliente tem o direito de desistir da contratação e solicitar o reembolso integral (100%) dos honorários de assessoria pagos à Self Service Registro de Veiculos LTDA (Despachante Aliança) no prazo de até 7 (sete) dias corridos contados a partir da data de pagamento, desde que o protocolo administrativo ou execução do serviço (junto ao Detran RS, guias de IPVA RS, Licenciamento RS ou preparação de recursos de Multas RS) ainda não tenha sido iniciado.
Caso o serviço técnico já tenha sido executado ou protocolado mediante autorização prévia do cliente, será restituído o saldo remanescente após a dedução proporcional do trabalho administrativo já realizado e de eventuais taxas públicas já recolhidas aos órgãos governamentais (uma vez que tributos e taxas públicas quitadas não são passíveis de estorno direto pelo órgão arrecadador).
Envie sua solicitação para o e-mail oficial julio.desp.nh@gmail.com ou pelo WhatsApp (51) 99240-0379 informando nome completo, CPF/CNPJ e comprovante de pagamento. O estorno é processado em até 5 (cinco) dias úteis através do mesmo meio de pagamento utilizado na contratação.
2. Política de Privacidade e Proteção de Dados (LGPD)
A Despachante Aliança (Self Service Registro de Veiculos LTDA - CNPJ 02.530.221/0001-05) respeita a privacidade de seus clientes e visitantes e cumpre rigorosamente a Lei Geral de Proteção de Dados Pessoais (LGPD - Lei nº 13.709/2018).
Coletamos apenas os dados estritamente necessários para a prestação dos serviços solicitados (como nome, CPF/CNPJ, telefone, e-mail, placa e Renavam do veículo). Essas informações são utilizadas exclusivamente para consultas preliminares, elaboração de orçamentos, preparação de documentos e comunicação sobre o andamento dos processos contratados.
Não vendemos, alugamos ou cedemos dados pessoais a terceiros para fins comerciais ou de marketing. Seus dados são tratados em ambiente seguro e o titular pode solicitar a qualquer momento a confirmação de tratamento, correção ou eliminação definitiva de seus dados através do e-mail julio.desp.nh@gmail.com.
3. Termos de Uso e Isenção de Vínculo Governamental
A Despachante Aliança atua exclusivamente como prestadora privada de serviços de preparação de documentos e apoio administrativo (CNAE 82.19-9-99). Não somos órgão público, autarquia, nem possuímos vínculo institucional ou governamental com o Departamento Estadual de Trânsito do Rio Grande do Sul (Detran RS), Secretaria da Fazenda (SEFAZ-RS) ou prefeituras.
Os serviços públicos podem ser solicitados diretamente pelo cidadão nos canais oficiais do governo sem custos de intermediação; os honorários cobrados por nossa empresa referem-se exclusivamente ao serviço privado de despachadoria, conferência documental e acompanhamento profissional. Os prazos de compensação bancária e análise final dependem exclusivamente dos órgãos públicos competentes.

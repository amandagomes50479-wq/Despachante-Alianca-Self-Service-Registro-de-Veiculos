<html lang="pt-BR">
<head>

    <style>
        :root {
            --primary: #0f3d2e;
            --primary-dark: #09261d;
            --secondary: #1e6b52;
            --accent: #f59e0b;
            --whatsapp: #25d366;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --text-dark: #1e293b;
            --text-muted: #475569;
            --border: #cbd5e1;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--white);
        }

        /* Aviso Legal Topo (Essencial para conformidade Google Ads) */
        .disclaimer-bar {
            background-color: #fef3c7;
            color: #92400e;
            text-align: center;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 1px solid #fde68a;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 900;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            display: block;
            font-size: 0.78rem;
            font-weight: 400;
            color: #cbd5e1;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--secondary) 100%);
            color: var(--white);
            padding: 68px 5%;
            text-align: center;
        }

        .badge-tradicao {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.14);
            color: #fef3c7;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.86rem;
            font-weight: 600;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .hero h1 {
            font-size: 2.2rem;
            max-width: 880px;
            margin: 0 auto 18px;
            line-height: 1.25;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 750px;
            margin: 0 auto 30px;
            opacity: 0.95;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-cta {
            display: inline-block;
            background-color: var(--accent);
            color: #111827;
            font-weight: 700;
            padding: 15px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.02rem;
            transition: transform 0.15s, opacity 0.2s;
        }

        .btn-cta:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-secondary {
            display: inline-block;
            background-color: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            font-weight: 600;
            padding: 15px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.02rem;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Seções Gerais */
        section {
            padding: 60px 5%;
            max-width: 1160px;
            margin: 0 auto;
        }

        .bg-alt {
            background-color: var(--bg-light);
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 14px;
            text-align: center;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            max-width: 760px;
            margin: 0 auto 36px;
            font-size: 1.02rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 24px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--white);
            padding: 28px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1.25rem;
        }

        .card ul {
            margin: 12px 0 16px 18px;
            color: var(--text-muted);
            font-size: 0.94rem;
        }

        .card ul li {
            margin-bottom: 6px;
        }

        .card-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--secondary);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .card-link:hover {
            text-decoration: underline;
        }

        /* Ficha Cadastral Completa */
        .registry-container {
            background-color: var(--white);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 30px;
            margin-top: 24px;
        }

        .registry-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 14px;
            margin-bottom: 22px;
        }

        .registry-header h3 {
            color: var(--primary);
            font-size: 1.35rem;
        }

        .registry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .registry-item {
            background-color: var(--bg-light);
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 3px solid var(--secondary);
        }

        .registry-item small {
            display: block;
            color: var(--text-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .registry-item strong {
            color: var(--text-dark);
            font-size: 0.96rem;
        }

        .qsa-box {
            margin-top: 20px;
            background-color: var(--bg-gray);
            padding: 16px 20px;
            border-radius: 6px;
        }

        .qsa-box h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        /* Políticas Completas e Visíveis */
        .policy-block {
            background: var(--white);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 26px;
            margin-bottom: 20px;
        }

        .policy-block h3 {
            color: var(--primary);
            font-size: 1.22rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .policy-block p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        /* Mapa e Contato */
        .map-frame {
            width: 100%;
            height: 300px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 28px;
        }

        /* Botão Flutuante WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background-color: var(--whatsapp);
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
            z-index: 999;
            font-size: 0.95rem;
        }

        .whatsapp-float:hover {
            opacity: 0.92;
        }

        /* Rodapé */
        footer {
            background-color: #0f172a;
            color: #cbd5e1;
            padding: 48px 5% 85px;
            font-size: 0.9rem;
        }
